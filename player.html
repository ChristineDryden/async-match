<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>选手对战记录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0b0c;
        --panel: #111113;
        --cell: #161618;
        --red: #d31c1c;
        --line: #2a2a2e;
        --text: #f3f3f4;
        --muted: #8a8a90;
        --win: #3dd68c;
        --loss: #ff5c5c;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", sans-serif;
      }
      body { padding: 28px 20px 64px; }
      .wrap { max-width: 1180px; margin: 0 auto; }
      a { color: inherit; }
      .back {
        color: var(--muted);
        text-decoration: none;
        font-size: 13px;
      }
      .back:hover { color: var(--text); }
      .kicker {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin: 18px 0 8px;
      }
      h1 {
        margin: 0;
        font-family: "Barlow Condensed", sans-serif;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .sub { color: var(--muted); font-size: 13px; }
      .section {
        margin-top: 32px;
      }
      .section h2 {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
        margin: 0 0 12px;
      }
      .board {
        width: 100%;
        border-collapse: separate;
        border-spacing: 6px 6px;
      }
      .board th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        text-align: center;
        padding: 0 6px 4px;
      }
      .board th.name-h { text-align: left; padding-left: 8px; }
      .board td { padding: 0; }
      .rank, .stat, .name {
        height: 44px;
        background: var(--cell);
        display: flex;
        align-items: center;
        justify-content: center;
        font-variant-numeric: tabular-nums;
      }
      .rank {
        width: 52px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 22px;
      }
      .name {
        justify-content: flex-start;
        padding: 0 16px;
        background: var(--red);
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 18px;
      }
      .name a { text-decoration: none; }
      .name a:hover { text-decoration: underline; }
      .stat { min-width: 72px; font-size: 15px; font-weight: 500; }
      .stat.win { color: var(--win); }
      .stat.loss { color: var(--loss); }
      .game {
        display: grid;
        grid-template-columns: 1fr auto 1fr auto;
        gap: 12px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 14px;
        margin-bottom: 6px;
      }
      .side { min-width: 0; }
      .side.away { text-align: right; }
      .pname {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 18px;
      }
      .pname a { text-decoration: none; }
      .pname a:hover { text-decoration: underline; }
      .tname { color: var(--muted); font-size: 12px; }
      .score {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 22px;
      }
      .mid { color: var(--muted); font-size: 11px; text-align: center; }
      .badge {
        width: 42px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 16px;
      }
      .badge.W { background: #143322; color: var(--win); }
      .badge.L { background: #3a1414; color: var(--loss); }
      .winner .pname, .winner .score { color: #fff; }
      .loser { opacity: 0.55; }
      .empty, .error { color: var(--muted); padding: 24px 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <a class="back" href="/">← 返回积分榜</a>
      <div class="kicker">
        <h1 id="title">选手</h1>
        <div class="sub" id="summary"></div>
      </div>
      <section class="section">
        <h2>对战过的选手</h2>
        <div id="rivals"></div>
      </section>
      <section class="section">
        <h2>比赛明细</h2>
        <div id="games"></div>
      </section>
    </div>
    <script src="./js/standings.js"></script>
    <script>
      const params = new URLSearchParams(location.search);
      const player = params.get("name") || "";

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function href(name) {
        return "/player.html?name=" + encodeURIComponent(name);
      }

      function fmtTime(iso) {
        return new Date(iso).toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      async function boot() {
        const title = document.getElementById("title");
        const summary = document.getElementById("summary");
        const rivalsRoot = document.getElementById("rivals");
        const gamesRoot = document.getElementById("games");
        if (!player) {
          title.textContent = "未指定选手";
          gamesRoot.innerHTML = '<p class="error">缺少选手名称。</p>';
          return;
        }
        document.title = player + " · 对战记录";
        title.textContent = player;

        const res = await fetch("/api/matches");
        if (!res.ok) {
          gamesRoot.innerHTML = '<p class="error">无法读取比赛数据。</p>';
          return;
        }
        const data = await res.json();
        const log = Standings.playerMatchLog(data.matches || [], player);
        const standings = Standings.computePlayerStandings(data.matches || []);
        const self = standings.find((row) => row.player === player);
        if (self) {
          summary.textContent =
            self.display + " · " + self.p + " 场 · " + self.wl + " · " + self.pctDisplay;
        } else {
          summary.textContent = log.length + " 场对战记录";
        }

        const rivals = Standings.opponentRecords(log);
        if (!rivals.length) {
          rivalsRoot.innerHTML = '<p class="empty">还没有对战记录。</p>';
        } else {
          rivalsRoot.innerHTML =
            '<table class="board"><thead><tr>' +
            "<th>#</th><th class='name-h'>对手</th><th>P</th><th>W-L</th><th>PCT</th><th>胜率</th>" +
            "</tr></thead><tbody>" +
            rivals
              .map(
                (row, i) =>
                  "<tr>" +
                  '<td><div class="rank">' + (i + 1) + "</div></td>" +
                  '<td><div class="name"><a href="' + href(row.opponent) + '">' +
                  esc(row.opponent) + "</a></div></td>" +
                  '<td><div class="stat">' + row.p + "</div></td>" +
                  '<td><div class="stat">' + row.wl + "</div></td>" +
                  '<td><div class="stat">' + row.pctDisplay + "</div></td>" +
                  '<td><div class="stat">' + row.winRate + "</div></td>" +
                  "</tr>"
              )
              .join("") +
            "</tbody></table>";
        }

        if (!log.length) {
          gamesRoot.innerHTML = '<p class="empty">没有找到该选手的比赛。</p>';
          return;
        }
        gamesRoot.innerHTML = log
          .map(function (game) {
            return (
              '<article class="game">' +
              '<div class="side ' + (game.won ? "winner" : "loser") + '">' +
              '<div class="pname">' + esc(player) + "</div>" +
              '<div class="tname">' + esc(game.team) + "</div>" +
              "</div>" +
              '<div>' +
              '<div class="score">' + game.playerScore + " – " + game.opponentScore + "</div>" +
              '<div class="mid">' + fmtTime(game.date) + " · #" + esc(game.id) + "</div>" +
              "</div>" +
              '<div class="side away ' + (game.won ? "loser" : "winner") + '">' +
              '<div class="pname"><a href="' + href(game.opponent) + '">' +
              esc(game.opponent) + "</a></div>" +
              '<div class="tname">' + esc(game.opponentTeam) + "</div>" +
              "</div>" +
              '<div class="badge ' + game.result + '">' + game.result + "</div>" +
              "</article>"
            );
          })
          .join("");
      }

      boot();
    </script>
  </body>
</html>
