<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Valhalla League · Basketball Standings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b0b0c;
        --panel: #111113;
        --cell: #161618;
        --cell-2: #1c1c1f;
        --red: #d31c1c;
        --red-deep: #b11616;
        --line: #2a2a2e;
        --text: #f3f3f4;
        --muted: #8a8a90;
        --win: #3dd68c;
        --loss: #ff5c5c;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", sans-serif;
      }

      body {
        padding: 28px 20px 64px;
      }

      .wrap {
        max-width: 1180px;
        margin: 0 auto;
      }

      .kicker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }

      .kicker-title {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--red);
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 18px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .kicker-title .dot {
        width: 10px;
        height: 10px;
        background: var(--red);
        flex: none;
      }

      .meta {
        color: var(--muted);
        font-size: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .tabs {
        display: flex;
        background: var(--cell);
        border: 1px solid var(--line);
      }

      .tabs button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 14px;
        padding: 8px 16px;
        cursor: pointer;
      }

      .tabs button.active {
        background: var(--red);
        color: #fff;
      }

      .tabs button kbd {
        display: inline-block;
        margin-left: 6px;
        padding: 0 5px;
        border: 1px solid currentColor;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0;
        opacity: 0.75;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        margin: 0 0 14px;
      }

      .range {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 0 0 14px;
      }

      .range label {
        color: var(--muted);
        font-size: 12px;
      }

      .dp {
        position: relative;
      }

      .dp-trigger {
        appearance: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        width: 196px;
        height: 36px;
        padding: 0 10px 0 12px;
        background: var(--cell);
        color: var(--text);
        border: 1px solid var(--line);
        cursor: pointer;
        font-family: "IBM Plex Sans", sans-serif;
        font-size: 13px;
        text-align: left;
      }

      .dp-trigger.open,
      .dp-trigger:hover {
        border-color: var(--red);
      }

      .dp-placeholder {
        color: var(--muted);
      }

      .dp-icon {
        color: var(--muted);
        display: flex;
      }

      .dp-panel {
        position: absolute;
        top: calc(100% + 6px);
        left: 0;
        z-index: 40;
        display: grid;
        grid-template-columns: 252px 92px;
        background: #1a1a1d;
        border: 1px solid var(--line);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      }

      .dp-panel[hidden] {
        display: none;
      }

      .dp-calendar {
        padding: 10px 10px 0;
      }

      .dp-head {
        display: flex;
        align-items: center;
        gap: 2px;
        margin-bottom: 8px;
      }

      .dp-title {
        flex: 1;
        text-align: center;
        font-size: 13px;
        font-weight: 600;
      }

      .dp-nav {
        appearance: none;
        width: 26px;
        height: 26px;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font-size: 14px;
      }

      .dp-nav:hover {
        color: var(--text);
        background: var(--cell);
      }

      .dp-weeks,
      .dp-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
      }

      .dp-weeks span {
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 12px;
      }

      .dp-day {
        appearance: none;
        height: 28px;
        border: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 12px;
      }

      .dp-day.out {
        color: #4d4d52;
      }

      .dp-day:hover {
        background: #2a2a2e;
      }

      .dp-day.today {
        color: var(--red);
        font-weight: 600;
      }

      .dp-day.selected,
      .dp-day.selected.today {
        background: var(--red);
        color: #fff;
      }

      .dp-time {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-left: 1px solid var(--line);
        height: 236px;
      }

      .dp-time-col {
        overflow: auto;
        padding: 6px 0;
      }

      .dp-time-col + .dp-time-col {
        border-left: 1px solid var(--line);
      }

      .dp-time-item {
        appearance: none;
        display: block;
        width: 100%;
        border: 0;
        background: transparent;
        color: var(--text);
        height: 28px;
        cursor: pointer;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .dp-time-item:hover {
        background: #2a2a2e;
      }

      .dp-time-item.selected {
        background: var(--red);
        color: #fff;
      }

      .dp-foot {
        grid-column: 1 / -1;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        border-top: 1px solid var(--line);
      }

      .dp-now,
      .dp-ok {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--red);
        cursor: pointer;
        font-size: 13px;
      }

      .dp-ok {
        background: var(--red);
        color: #fff;
        padding: 4px 12px;
      }

      .action {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--cell);
        color: var(--text);
        height: 36px;
        padding: 0 14px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .action.primary {
        background: var(--red);
        border-color: var(--red);
        color: #fff;
      }

      .action:disabled {
        opacity: 0.55;
        cursor: wait;
      }

      .board {
        width: 100%;
        border-collapse: separate;
        border-spacing: 6px 6px;
      }

      .board th {
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        text-align: center;
        padding: 0 6px 4px;
      }

      .board th.team-h {
        text-align: left;
        padding-left: 8px;
      }

      .rank {
        width: 52px;
        height: 44px;
        background: var(--cell);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 22px;
      }

      .team {
        height: 44px;
        background: var(--red);
        display: flex;
        align-items: center;
        padding: 0 16px;
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: 0.02em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .player-link {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 255, 255, 0.45);
      }

      .player-link:hover {
        border-bottom-color: #fff;
      }

      .stat {
        height: 44px;
        min-width: 72px;
        background: var(--cell);
        display: flex;
        align-items: center;
        justify-content: center;
        font-variant-numeric: tabular-nums;
        font-size: 15px;
        font-weight: 500;
      }

      .stat.win {
        color: var(--win);
      }

      .stat.loss {
        color: var(--loss);
      }

      .board td {
        padding: 0;
      }

      .results {
        margin-top: 40px;
      }

      .results h2 {
        font-family: "Barlow Condensed", sans-serif;
        font-size: 16px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
        margin: 0 0 12px;
      }

      .game {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 12px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 10px 14px;
        margin-bottom: 6px;
      }

      .side {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .side.away {
        text-align: right;
        align-items: flex-end;
      }

      .pname {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 700;
        font-size: 16px;
      }

      .tname {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
      }

      .scorebox {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-width: 88px;
      }

      .score {
        font-family: "Barlow Condensed", sans-serif;
        font-weight: 800;
        font-size: 22px;
        letter-spacing: 0.04em;
      }

      .mid {
        color: var(--muted);
        font-size: 11px;
      }

      .winner .pname,
      .winner .score {
        color: #fff;
      }

      .loser {
        opacity: 0.55;
      }

      .empty,
      .error {
        color: var(--muted);
        padding: 24px 0;
      }

      @media (max-width: 800px) {
        .board {
          font-size: 13px;
        }
        .team {
          font-size: 15px;
          padding: 0 10px;
        }
        .stat,
        .rank {
          min-width: 48px;
          height: 40px;
        }
        .stat {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="kicker">
        <div class="kicker-title">
          <span class="dot"></span>
          <span id="headline">Valhalla League Basketball</span>
        </div>
        <div class="meta" id="meta">Loading…</div>
      </div>

      <div class="toolbar">
        <div class="filters">
          <div class="tabs" id="mode-tabs">
            <button type="button" data-mode="team">球队积分榜</button>
            <button type="button" class="active" data-mode="player">选手积分榜</button>
          </div>
          <div class="tabs" id="time-tabs">
            <button type="button" class="active" data-hours="">全部 <kbd>0</kbd></button>
            <button type="button" data-hours="3">3h <kbd>1</kbd></button>
            <button type="button" data-hours="6">6h <kbd>2</kbd></button>
            <button type="button" data-hours="12">12h <kbd>3</kbd></button>
          </div>
        </div>
        <div class="meta" id="count"></div>
      </div>
      <div class="range">
        <label>从</label>
        <div id="from-picker"></div>
        <label>到</label>
        <div id="to-picker"></div>
        <button type="button" class="action" id="apply-range">应用区间</button>
        <button type="button" class="action" id="clear-range">清除区间</button>
        <button type="button" class="action primary" id="sync-btn">一键同步</button>
        <span class="meta" id="sync-status"></span>
      </div>
      <p class="hint">快捷键：1 = 最近 3 小时，2 = 最近 6 小时，3 = 最近 12 小时，0 = 全部。也可自定义起止时间。同步只入库新场次，并从库内最新比赛时间点接着爬。</p>

      <div id="table-root"></div>

      <section class="results">
        <h2>近期篮球赛果</h2>
        <div id="games-root"></div>
      </section>
    </div>

    <script src="./js/standings.js"></script>
    <script src="./js/datepicker.js"></script>
    <script>
      const fmtDate = (iso) => {
        if (!iso) return "";
        const d = new Date(iso);
        const dd = String(d.getDate()).padStart(2, "0");
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const yyyy = d.getFullYear();
        return `${dd}.${mm}.${yyyy}`;
      };

      const fmtTime = (iso) => {
        const d = new Date(iso);
        return d.toLocaleString("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
      };

      const streakClass = (strk) => {
        if (!strk) return "";
        if (strk.startsWith("W")) return "win";
        if (strk.startsWith("L")) return "loss";
        return "";
      };

      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function playerHref(name) {
        return "/player.html?name=" + encodeURIComponent(name);
      }

      function renderTable(rows) {
        const body = rows
          .map(
            (row) => `
          <tr>
            <td><div class="rank">${row.rank}</div></td>
            <td><div class="team">${esc(row.team)} (<a class="player-link" href="${playerHref(row.player)}">${esc(row.player)}</a>)</div></td>
            <td><div class="stat">${row.p}</div></td>
            <td><div class="stat">${row.wl}</div></td>
            <td><div class="stat">${row.pctDisplay}</div></td>
            <td><div class="stat">${row.winRate || ""}</div></td>
            <td><div class="stat">${row.gbDisplay}</div></td>
            <td><div class="stat">${row.l5}</div></td>
            <td><div class="stat ${streakClass(row.strk)}">${row.strk}</div></td>
          </tr>`
          )
          .join("");

        return `
          <table class="board">
            <thead>
              <tr>
                <th>#</th>
                <th class="team-h"></th>
                <th>P</th>
                <th>W-L</th>
                <th>PCT</th>
                <th>胜率</th>
                <th>GB</th>
                <th>L5</th>
                <th>STRK</th>
              </tr>
            </thead>
            <tbody>${body}</tbody>
          </table>`;
      }

      function renderGames(matches) {
        if (!matches.length) {
          return `<p class="empty">该时间窗口内没有篮球比赛。</p>`;
        }
        return matches
          .slice(0, 24)
          .map((m) => {
            const homeWin = m.home_score > m.away_score;
            return `
            <article class="game">
              <div class="side ${homeWin ? "winner" : "loser"}">
                <div class="pname">${m.home_player}</div>
                <div class="tname">${m.home_team}</div>
              </div>
              <div class="scorebox">
                <div class="score">${m.home_score} – ${m.away_score}</div>
                <div class="mid">${fmtTime(m.date)} · #${m.id}</div>
              </div>
              <div class="side away ${homeWin ? "loser" : "winner"}">
                <div class="pname">${m.away_player}</div>
                <div class="tname">${m.away_team}</div>
              </div>
            </article>`;
          })
          .join("");
      }

      function setActive(group, attr, value) {
        group.querySelectorAll("button").forEach((btn) => {
          const current = btn.dataset[attr] || "";
          btn.classList.toggle("active", current === String(value));
        });
      }

      async function boot() {
        const root = document.getElementById("table-root");
        const gamesRoot = document.getElementById("games-root");
        const syncBtn = document.getElementById("sync-btn");
        const syncStatus = document.getElementById("sync-status");
        try {
          const loadMatches = async () => {
            const res = await fetch("/api/matches");
            if (!res.ok) throw new Error("api/matches " + res.status);
            return res.json();
          };

          let payload = await loadMatches();
          let mode = "player";
          let hours = null;
          let rangeFrom = null;
          let rangeTo = null;
          const modeTabs = document.getElementById("mode-tabs");
          const timeTabs = document.getElementById("time-tabs");
          const fromPicker = DatePicker.mount(document.getElementById("from-picker"), {
            placeholder: "开始时间",
            defaultHour: 0,
            defaultMinute: 0,
          });
          const toPicker = DatePicker.mount(document.getElementById("to-picker"), {
            placeholder: "结束时间",
            defaultHour: 23,
            defaultMinute: 59,
          });

          const refreshMeta = () => {
            const dates = (payload.matches || []).map((m) => m.date).filter(Boolean);
            const first = dates.length ? dates[dates.length - 1] : null;
            const last = dates.length ? dates[0] : null;
            document.getElementById("headline").textContent =
              `Valhalla League Basketball  ${fmtDate(last)}`;
            document.getElementById("meta").textContent =
              `${payload.count || 0} 场已入库  ·  ${fmtDate(first)} – ${fmtDate(last)}  ·  MySQL`;
          };

          const draw = () => {
            let filtered = payload.matches || [];
            let label = "全部数据";
            if (hours) {
              filtered = Standings.filterMatchesByHours(filtered, hours);
              label = `最近 ${hours} 小时`;
            } else if (rangeFrom != null || rangeTo != null) {
              filtered = Standings.filterMatchesByRange(filtered, rangeFrom, rangeTo);
              label = "自定义区间";
            }
            const rows =
              mode === "team"
                ? Standings.computeTeamStandings(filtered)
                : Standings.computePlayerStandings(filtered);
            root.innerHTML = rows.length
              ? renderTable(rows)
              : `<p class="empty">该时间窗口内没有篮球比赛，换一个时间范围或点同步。</p>`;
            gamesRoot.innerHTML = renderGames(
              filtered
                .slice()
                .sort((a, b) => Date.parse(b.date) - Date.parse(a.date))
            );
            document.getElementById("count").textContent =
              `${label} · ${filtered.length} 场 · 按${mode === "team" ? "球队" : "选手"}统计`;
          };

          const setMode = (next) => {
            mode = next;
            setActive(modeTabs, "mode", mode);
            draw();
          };

          const clearRangeInputsState = (clearInputs) => {
            rangeFrom = null;
            rangeTo = null;
            if (clearInputs) {
              fromPicker.clear();
              toPicker.clear();
            }
          };

          const setHours = (next, lockPlayer) => {
            hours = next;
            clearRangeInputsState(true);
            setActive(timeTabs, "hours", hours == null ? "" : hours);
            if (lockPlayer) mode = "player";
            setActive(modeTabs, "mode", mode);
            draw();
          };

          modeTabs.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", () => setMode(btn.dataset.mode));
          });
          timeTabs.querySelectorAll("button").forEach((btn) => {
            btn.addEventListener("click", () => {
              const value = btn.dataset.hours;
              setHours(value ? Number(value) : null, Boolean(value));
            });
          });

          document.getElementById("apply-range").addEventListener("click", () => {
            const fromDate = fromPicker.getValue();
            const toDate = toPicker.getValue();
            rangeFrom = fromDate ? fromDate.getTime() : null;
            rangeTo = toDate ? toDate.getTime() : null;
            if (rangeFrom == null && rangeTo == null) return;
            hours = null;
            setActive(timeTabs, "hours", "");
            mode = "player";
            setActive(modeTabs, "mode", mode);
            draw();
          });

          document.getElementById("clear-range").addEventListener("click", () => {
            setHours(null, false);
          });

          syncBtn.addEventListener("click", async () => {
            syncBtn.disabled = true;
            syncStatus.textContent = "正在从 drafted.gg 增量同步…";
            try {
              const res = await fetch("/api/sync", { method: "POST" });
              if (!res.ok) throw new Error("sync " + res.status);
              const result = await res.json();
              payload = await loadMatches();
              refreshMeta();
              draw();
              const from = result.watermark ? "从 " + fmtTime(result.watermark) : "空库全量";
              syncStatus.textContent =
                `${from} · 新增 ${result.inserted} · 已存在跳过 ${result.skipped} · 库内 ${result.total} 场`;
            } catch (err) {
              syncStatus.textContent = "同步失败：" + err;
            } finally {
              syncBtn.disabled = false;
            }
          });

          document.addEventListener("keydown", (event) => {
            if (event.metaKey || event.ctrlKey || event.altKey) return;
            const tag = (event.target && event.target.tagName) || "";
            if (
              tag === "INPUT" ||
              tag === "TEXTAREA" ||
              tag === "BUTTON" ||
              event.target.isContentEditable ||
              event.target.closest(".dp")
            ) {
              return;
            }
            if (event.key === "1") setHours(3, true);
            if (event.key === "2") setHours(6, true);
            if (event.key === "3") setHours(12, true);
            if (event.key === "0") setHours(null, false);
          });

          refreshMeta();
          draw();
        } catch (err) {
          root.innerHTML = `<p class="error">无法读取数据库比赛数据。请运行 python3 -m server.app 后刷新。<br>${err}</p>`;
        }
      }

      boot();
    </script>
  </body>
</html>
